allowBuilds:
  esbuild: true
  lightningcss: true
  "@sentry/cli": true
  better-sqlite3: true
onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - "@sentry/cli"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - cn@0.2.6
